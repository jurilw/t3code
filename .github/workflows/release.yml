name: Release patched T3 Code

# Follows upstream stable releases of pingdotgg/t3code. For each new one it
# applies patches/*.patch, runs the release gate (ci/gate.sh: every patch
# wired in and tested), builds the Windows x64 installer with this fork as its
# update feed, checks the built bundles contain every patch
# (ci/verify-build.sh), and creates a release here with the same version.
#
# Publish mode (safety): releases are created as DRAFTS unless told
# otherwise. Drafts are invisible to the app's updater, so nothing
# auto-installs anywhere until Juri approves. To approve:
#   - one release:   gh release edit <tag> -R jurilw/t3code --draft=false --latest
#   - from now on:   gh variable set PUBLISH_MODE -R jurilw/t3code --body release
# Manual runs can pick draft | prerelease | release for that run.
#
# 0000-upstream-<sha>-* backports an upstream build fix (pinned patched
# dependencies; without it the Windows server sidecar install fails with
# ERR_PNPM_UNUSED_PATCH for node-pty) and is skipped once the tag contains it.
# Patches 0001 (burn meter) and 0002 (dictation) change the desktop and web
# client only. 0003 (legacy V1 thread import) changes the server bundled as
# the desktop's local backend. SSH and WSL environments keep the official
# server (the WSL archive below is downloaded from upstream unchanged).
#
# If a patch no longer applies, the run fails and nothing is published;
# selfrepair/selfrepair.sh on pgx then tries to refresh the patches.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream tag to build (defaults to the latest stable release)
        required: false
      force:
        description: Rebuild even if this fork already has a release (or draft) for the tag
        type: boolean
        default: false
      publish_mode:
        description: "draft (default, invisible to updaters) | prerelease | release (auto-updates installed copies)"
        type: choice
        options: [default, draft, prerelease, release]
        default: default

permissions:
  contents: write

concurrency:
  group: patched-release
  cancel-in-progress: false

env:
  UPSTREAM: pingdotgg/t3code
  # The public Clerk key the official app ships, so T3 account sign-in still works.
  T3CODE_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsudDMuY29kZXMk
  VITE_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsudDMuY29kZXMk

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      build: ${{ steps.pick.outputs.build }}
      mode: ${{ steps.pick.outputs.mode }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          FORCE: ${{ inputs.force }}
          INPUT_MODE: ${{ inputs.publish_mode }}
          REPO_MODE: ${{ vars.PUBLISH_MODE }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)}"
          mode="${INPUT_MODE:-default}"
          if [ "$mode" = "default" ]; then mode="${REPO_MODE:-draft}"; fi
          case "$mode" in draft|prerelease|release) ;; *) echo "Unknown publish mode '$mode'"; exit 1 ;; esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Publish mode: $mode"
          # gh release view also finds drafts (the token belongs to the repo).
          if [ "$FORCE" != "true" ] && gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Already released $tag."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Building $tag."
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - name: Checkout patches
        uses: actions/checkout@v4
        with:
          path: ci

      - name: Checkout upstream release
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ env.TAG }}
          path: src

      - name: Apply patches
        shell: bash
        working-directory: src
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "side-quests-ci"
          git config user.email "side-quests-ci@users.noreply.github.com"
          for patch in ../ci/patches/*.patch; do
            name="$(basename "$patch")"
            # NNNN-upstream-<sha>-*.patch backports an upstream commit; skip it once the tag has it.
            if [[ "$name" =~ ^[0-9]+-upstream-([0-9a-f]{7,40})- ]]; then
              status="$(gh api "repos/$UPSTREAM/compare/${BASH_REMATCH[1]}...$TAG" --jq .status)"
              if [ "$status" = ahead ] || [ "$status" = identical ]; then
                echo "Skipping $name: $TAG already contains upstream ${BASH_REMATCH[1]}"
                continue
              fi
            fi
            echo "Applying $name"
            git am --3way "$patch"
          done

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: src/package.json
          cache: false
          run-install: false

      - name: Install dependencies
        working-directory: src
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts... --filter=@t3tools/web...

      - name: Release gate (burn meter, dictation, legacy thread import)
        shell: bash
        run: bash ci/ci/gate.sh src

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Install Spectre-mitigated MSVC libs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) { exit 1 }

      - name: Download official Linux server for the WSL backend
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mkdir -p wsl-runtime
          gh release download "$TAG" -R "$UPSTREAM" -D wsl-runtime \
            -p "t3-$version-linux-x64.tar.gz" -p SHA256SUMS
          (cd wsl-runtime && grep " \*\{0,1\}t3-$version-linux-x64.tar.gz$" SHA256SUMS | sha256sum -c -)

      - name: Build installer
        shell: bash
        working-directory: src
        env:
          # Makes electron-builder emit latest.yml and point the app's updater here.
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          node scripts/update-release-package-versions.ts "$version"
          node scripts/build-desktop-artifact.ts \
            --platform win --target nsis --arch x64 \
            --build-version "$version" \
            --wsl-runtime "$GITHUB_WORKSPACE/wsl-runtime/t3-$version-linux-x64.tar.gz" \
            --output-dir "$GITHUB_WORKSPACE/release"
          ls -la "$GITHUB_WORKSPACE/release"

      - name: Build gate (every patch is in the bundles)
        shell: bash
        run: bash ci/ci/verify-build.sh src

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.TAG }}
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.check.outputs.tag }}
      MODE: ${{ needs.check.outputs.mode }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ env.TAG }}
          path: release

      - name: Publish release
        run: |
          set -euo pipefail
          notes="Official T3 Code $TAG plus the patches in this repo's patches/ folder:
          burn-rate meter, local dictation (desktop, whisper.cpp), import of V1 threads created after the V2 upgrade.
          Unsigned Windows x64 build: SmartScreen shows a warning on first install.
          Upstream release notes: https://github.com/$UPSTREAM/releases/tag/$TAG"
          case "$MODE" in
            draft) flags=(--draft) ;;
            prerelease) flags=(--prerelease --latest=false) ;;
            release) flags=(--latest) ;;
          esac
          # Tag this repo's own commit: tagging the upstream commit fails with
          # HTTP 403 whenever that release touched .github/workflows, because
          # GITHUB_TOKEN cannot have the workflows permission.
          gh release delete "$TAG" -R "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
            --title "T3 Code $TAG + patches" \
            --notes "$notes" \
            --target "$GITHUB_SHA" \
            "${flags[@]}" \
            release/*
          echo "Created $MODE release $TAG"
